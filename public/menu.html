<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#C2410C">
  <title>Menu</title>
  <link rel="icon" href="icons/icon-192.png">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #F4F5F7; --surface: #FFFFFF; --surface-2: #F1F2F5; --line: #E4E6EB;
      --text: #14161A; --muted: #5B606B; --accent: #C2410C; --accent-soft: #FFF1E8; --on-accent: #FFFFFF;
      --veg: #15803D; --nonveg: #B91C1C; --star: #B45309;
      --radius: 18px; --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Noto Sans", system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0E0F12; --surface: #191B20; --surface-2: #22252B; --line: #2C2F36; --text: #EEF0F3; --muted: #A2A7B2;
        --accent: #FF8A4C; --accent-soft: #3A2216; --on-accent: #1A0D05; --veg: #4ADE80; --nonveg: #FF7B7B; --star: #FBBF24; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 var(--font); }
    .hero { background: linear-gradient(140deg, #C2410C, #9A3412); color: #fff; padding: 28px 18px 22px; }
    .hero h1 { margin: 0; font-size: 28px; line-height: 1.15; letter-spacing: -0.02em; }
    .hero p { margin: 6px 0 0; opacity: 0.92; font-size: 14.5px; }
    .hero .actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    .hero a { color: #fff; background: rgb(255 255 255 / 0.16); border-radius: 999px; padding: 8px 14px; text-decoration: none; font-weight: 700; font-size: 14.5px; }
    .tools { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); padding: 12px 16px 10px; border-bottom: 1px solid var(--line); }
    .tools input { width: 100%; min-height: 46px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
      color: var(--text); font: inherit; padding: 10px 14px; }
    .tools input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
    .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-top: 10px; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: none; min-height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid var(--line); background: var(--surface);
      color: var(--text); font: inherit; font-weight: 700; font-size: 14px; cursor: pointer; }
    .chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: transparent; }
    .filters { display: flex; gap: 8px; margin-top: 10px; }
    main { padding: 8px 16px 40px; max-width: 760px; margin: 0 auto; }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 22px 4px 8px; }
    .list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
    .dish { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
    .dish:last-child { border-bottom: 0; }
    .mark { flex: none; width: 15px; height: 15px; border: 1.5px solid var(--veg); border-radius: 3px; display: grid; place-items: center; }
    .mark::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--veg); }
    .mark.nv { border-color: var(--nonveg); }
    .mark.nv::after { background: var(--nonveg); }
    .name { flex: 1; min-width: 0; font-weight: 600; }
    .name .star { color: var(--star); font-size: 13px; font-weight: 700; margin-left: 6px; white-space: nowrap; }
    .price { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .note { text-align: center; color: var(--muted); padding: 40px 16px; }
    .note strong { display: block; font-size: 20px; color: var(--text); margin-bottom: 6px; }
    footer { text-align: center; color: var(--muted); font-size: 13px; padding: 10px 16px 30px; }
    .skeleton { height: 54px; margin: 10px 0; border-radius: 14px; background: var(--surface-2); animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.5; } }
    @media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }
  </style>
</head>
<body>
  <div id="app"><main><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></main></div>
  <script type="module" src="menu.js"></script>
</body>
</html>
