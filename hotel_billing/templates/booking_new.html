{% extends "base.html" %}
{% block title %}Check in{% endblock %}
{% block content %}
<h1>Check in guest</h1>
{% if not rooms %}
  <p>No rooms are available. <a href="{{ url_for('main.rooms') }}">Manage rooms</a></p>
{% else %}
<form method="post" class="stack">
  <label>Room
    <select name="room_id" required>
      {% for r in rooms %}
        <option value="{{ r.id }}" {{ 'selected' if form.get('room_id')|int == r.id }}>
          {{ r.number }} – {{ r.room_type }} (₹{{ r.rate|money }}/night)</option>
      {% endfor %}
    </select>
  </label>
  <label>Guest name <input name="guest_name" value="{{ form.get('guest_name', '') }}" required></label>
  <label>Phone <input name="guest_phone" value="{{ form.get('guest_phone', '') }}"></label>
  <label>Address <textarea name="guest_address" rows="2">{{ form.get('guest_address', '') }}</textarea></label>
  <label>Guest GSTIN (optional) <input name="guest_gstin" value="{{ form.get('guest_gstin', '') }}"></label>
  <div class="row">
    <label>Check-in <input type="date" name="check_in" value="{{ form.get('check_in', today) }}" required></label>
    <label>Expected check-out <input type="date" name="check_out" value="{{ form.get('check_out', '') }}" required></label>
  </div>
  <label>Rate per night (leave blank for room's default)
    <input name="rate" inputmode="decimal" value="{{ form.get('rate', '') }}">
  </label>
  <button>Check in</button>
</form>
{% endif %}
{% endblock %}
