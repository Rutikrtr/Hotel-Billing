[build]
  publish = "public"
  # Builds public/config.js from the SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY environment variables.
  command = "node scripts/write-config.mjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
