# Builds the Master Bill React Native app (mobile/) as an unsigned release APK on GitHub's servers, which have
# the Android SDK. The APK goes to the "mobile-apk-unsigned" branch and is signed afterwards with the private
# release key, which never comes to GitHub.
name: Build Master Bill mobile app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/mobile.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Type check and logic tests
        run: npx tsc --noEmit && npx tsx --test tests/logic.test.ts
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build unsigned release APK
        working-directory: mobile/android
        run: |
          # Release builds are signed later with the private key, not Expo's debug key.
          sed -i 's/signingConfig signingConfigs.debug//' app/build.gradle
          ./gradlew assembleRelease --no-daemon
      - name: Publish to the mobile-apk-unsigned branch
        working-directory: mobile
        run: |
          mkdir out
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk out/master-bill-unsigned.apk
          echo "${{ github.sha }}" > out/SOURCE_COMMIT
          cd out
          git init -q -b mobile-apk-unsigned
          git add .
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -q -m "Unsigned APK from ${{ github.sha }}"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" mobile-apk-unsigned
