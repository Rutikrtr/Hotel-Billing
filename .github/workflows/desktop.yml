# Builds Master Bill 2.5, the Windows desktop app (desktop/), on GitHub's Windows servers: the 2.0 screens'
# web build is packed inside an Electron app, giving one portable .exe (no installer). The .exe is published
# as a GitHub release (files there may be over 100 MB):
# https://github.com/Rutikrtr/Hotel-Billing/releases/download/desktop-2.5/Master-Bill-2.5.exe
name: Build Master Bill desktop app (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']

permissions:
  contents: write

# One build at a time, so an older build can never replace a newer .exe in the release.
concurrency:
  group: desktop-release
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            desktop/package-lock.json
      - name: Build the 2.0 screens for the web
        working-directory: mobile
        run: npm ci && npx tsc --noEmit && npx tsx --test tests/*.test.ts && npm run build:web
      - name: Build the Windows app
        working-directory: desktop
        run: npm ci && npm run dist
      - name: Publish the .exe as the "desktop-2.5" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la desktop/dist/Master-Bill-2.5.exe
          notes="Master Bill 2.5 – Windows desktop app (portable .exe, no installer). Built from $GITHUB_SHA."
          if gh release view desktop-2.5 >/dev/null 2>&1; then
            gh release upload desktop-2.5 desktop/dist/Master-Bill-2.5.exe --clobber
            gh release edit desktop-2.5 --notes "$notes"
          else
            gh release create desktop-2.5 desktop/dist/Master-Bill-2.5.exe --title "Master Bill 2.5 (Windows)" --notes "$notes" --latest=false
          fi
