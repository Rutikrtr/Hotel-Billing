# Publishes the app to GitHub Pages on every push to main.
# Supabase settings: repository variables SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY
# (Settings → Secrets and variables → Actions → Variables) override the defaults below.
# The publishable key is public by design; data access is enforced by row-level security.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Write config.js from repository variables
        run: node scripts/write-config.mjs
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://ftzhystkinhxxgddnqgp.supabase.co' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_bRTN9xO8cQ_CxnGOC-duGA_9SwWYB94' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
