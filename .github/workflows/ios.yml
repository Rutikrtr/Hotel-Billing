# Checks that the iPhone version of Master Bill (mobile/) compiles, on GitHub's Mac servers. It builds for the
# iPhone simulator, which needs no Apple account or signing. Run it by hand (Actions → Run workflow): Mac minutes
# cost more, so it does not run on every push. Real iPhone builds for TestFlight/App Store need an Apple
# Developer account (see mobile/README.md).
name: Check Master Bill iPhone build

on:
  workflow_dispatch:

jobs:
  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Type check and logic tests
        run: npx tsc --noEmit && npx tsx --test tests/*.test.ts
      - name: Generate the iPhone project and install its libraries
        run: npx expo prebuild --platform ios
      - name: Build for the iPhone simulator (no signing)
        run: |
          set -o pipefail
          xcodebuild -workspace ios/MasterBill.xcworkspace -scheme MasterBill -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
