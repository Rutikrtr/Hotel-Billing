# Opens the latest Master Bill APK on an Android emulator and records what happens: start-up log
# (errors from the app's JavaScript and Android) and screenshots. Results go to the "mobile-test-results" branch.
name: Test Master Bill on an emulator

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Build Master Bill mobile app']
    types: [completed]

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    steps:
      - name: Enable KVM (faster emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Get the APK
        run: |
          git clone -q --depth 1 -b mobile-apk-unsigned "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk
          cp apk/master-bill-unsigned.apk app-unsigned.apk
          cat apk/SOURCE_COMMIT
      - name: Sign with a throwaway test key (only for the emulator)
        run: |
          keytool -genkeypair -keystore test.jks -storepass testpass -keypass testpass -alias test -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Test" -noprompt
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f 4 app-unsigned.apk app-aligned.apk
          $BT/apksigner sign --ks test.jks --ks-pass pass:testpass --out app-test.apk app-aligned.apk
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r app-test.apk
            adb logcat -c
            adb shell am start -n in.techyverve.masterbill/.MainActivity
            sleep 25
            mkdir -p out
            adb exec-out screencap -p > out/after-25s.png
            sleep 20
            adb exec-out screencap -p > out/after-45s.png
            adb logcat -d -v time > out/logcat-full.txt || true
            grep -E "ReactNativeJS|AndroidRuntime|FATAL|Exception|Error|masterbill|ReactNative|Hermes" out/logcat-full.txt | tail -400 > out/logcat-app.txt || true
            adb shell pidof in.techyverve.masterbill > out/still-running.txt || echo "NOT RUNNING" > out/still-running.txt
      - name: Publish results
        if: always()
        run: |
          mkdir -p out && cp apk/SOURCE_COMMIT out/ 2>/dev/null || true
          cd out
          git init -q -b mobile-test-results
          git add .
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -q -m "Emulator test results"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" mobile-test-results
